[package]
name = "desktop-vision-rs"
version = "1.0.0"
edition = "2021"
description = "Ultra-Fast Pure-Rust & Native C++ AVX2 Vision, Multilingual OCR (Bengali + English + Code), UI Box & SVG Structural Engine"

[[bin]]
name = "desktop-vision-rs"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = "symbols"
